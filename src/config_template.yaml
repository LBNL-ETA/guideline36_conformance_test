device:
  # Device type: 'bacnet'
  # Use this for testing physical or virtual BACnet controllers
  type: bacnet
  
  # IP address for BACnet network connection
  network_address:
  
  # BACnet device address
  device_address:
  
  # BACnet device ID
  device_id:
  
  # Path to the point mapping CSV file (relative to ./files/)
  # This maps test variable names to BACnet point names
  # CSV format: header on row 4, columns include 'Variable Name' and 'BACnet Name'
  point_map:

test:
  # Path to the test script Excel file (relative to ./files/)
  test_script:
  
  # Optional: point mapping can be specified here or in device section
  point_map:
  
  # Optional: Excel header names for different sections
  # Defaults shown below if not specified
  input_points_header: "BACnet Inputs"
  conditions_header: "Conditions for Evaluation of Test Step"
  output_points_header: "BACnet Expected Outputs"