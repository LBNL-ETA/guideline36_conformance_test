name: g36_conformance_test

services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    command: sleep infinity
    volumes:
      - ./:/work
      - cache:/root/.cache
      - cache:/root/.openmodelica
    stdin_open: true # equivalent to docker run -i
    tty: true        # equivalent to docker run -t


volumes:
  cache:
