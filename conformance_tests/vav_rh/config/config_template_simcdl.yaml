# Test type identifier (must match directory name in conformance_tests/)
test_type: vav_rh

device:
  # Device type: 'simulation' (or 'simcdl' for backwards compatibility)
  # Use this for testing FMU/Modelica models
  type: simulation
  
  # Path to the Modelica model file (.mo) - relative to project root
  model_filepath: conformance_tests/vav_rh/simulation_files/testscript_VAVRH_20250129_fmu.mo
  
  # Modelica path to the model within the .mo file
  model_mopath: testscript_VAVRH_20250129_fmu
  
  # Whether to compile the FMU from the .mo file (true/false)
  # Set to false if FMU already exists
  compile_fmu: true
  
  # Path to the point mapping CSV file - relative to project root
  # This maps test variable names to CDL paths
  point_map: 'conformance_tests/vav_rh/config/2025-08-26 - VAVRH Point Mapping File - CDL[35].csv'
  
  # Path to the compiled FMU file (optional, auto-generated from model_filepath if not specified)
  # Build artifacts (.libs, .makefile, .log, .mat) will be written to simulation_files/build/
  fmu_filepath: conformance_tests/vav_rh/simulation_files/testscript_VAVRH_20250129_fmu.fmu

test:
  # Test script filename (located in conformance_tests/vav_rh/test_scripts/)
  test_script: '2025-08-26 - VAVRH Test Script Draft 14.xlsx'
  input_points_header: "BACnet Inputs"
  conditions_header: "Conditions for Evaluation of Test Step"
  output_points_header: "BACnet Expected Outputs"
