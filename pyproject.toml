[project]
name = "g36conftest"
version = "0.0.1"
# 'common'
dependencies = [ 
    "pyyaml",
    "pandas",
    "numpy",
    "openpyxl",
    'pint', "pyfmi",
]

[project.optional-dependencies] # (not dep group)
# installable like g36conftest[bacnet, simulation]
# interpreted as 'features' by pixi
bacnet =     ["BAC0"]
simulation = ["pyfmi", ] # pyfmi on pypi is neglected:
# last update dec ~2018.
# no windows wheel.
# otherwise this is almost a std standard python project.
viz = ["streamlit>=1.35", "plotly>=5.20", "pyyaml"]
[tool.pixi.feature.simulation.dependencies]
pyfmi = ">=2.21.0,<3"  # get pyfmi from conda (overrides above)
[tool.pixi.feature.simulation.target.linux-64.dependencies]
omcompiler = '*'                                            # openmodelica only available on linux64
[tool.pixi.feature.simulation.target.win-64.dependencies]   # but not other platforms (install it some other way)
[tool.pixi.feature.simulation.target.win-64.activation]
env = {"PATH" = "%PATH%;%OPENMODELICAHOME%/bin" }
[tool.pixi.feature.simulation.target.osx-64.dependencies]    # so these are empty to denote not to do anything
[tool.pixi.feature.simulation.target.osx-arm64.dependencies] # so these are empty to denote not to do anything
[tool.pixi.feature.simulation.target.linux-aarch64.dependencies] # so these are empty to denote not to do anything


[project.scripts]
g36conftest = "g36conftest.cli:cli"
g36conftest-viz = "viz.launcher:main"

# Both `g36conftest` (in src/g36conftest/) and `viz` (in src/viz/) are packages
# — tell setuptools to pick up every package under src/ instead of relying on
# single-package auto-discovery.
[tool.setuptools.packages.find]
where = ["src"]


[dependency-groups]
test = ["pytest", 'pytest-regressions']
#'dev' specifically can be for debugging, formatting, ...
dev = [ {include-group = "test"}, ] # 


[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = [
    "win-64", "linux-64", "osx-64",
    "osx-arm64", "linux-aarch64"]

[tool.pixi.pypi-dependencies]
g36conftest = { path = ".", editable = true }


[tool.pixi.feature.viz.pypi-dependencies]
streamlit = ">=1.35"
plotly = ">=5.20"

[tool.pixi.environments]
default = { solve-group = "default" }  # just the 'common' ones
bacnet =    {  features = ["bacnet",     'test', 'viz'],   solve-group = "default" }
simulation = { features = ["simulation", 'test', 'viz'],   solve-group = "default" }
viz =        { features = ["viz"],                          solve-group = "default" }

[tool.pixi.tasks]

